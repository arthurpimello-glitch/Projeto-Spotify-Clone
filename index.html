<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Spotify Clone - Login</title>

    <link rel="stylesheet" href="./css/login.css">

    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#050505">
</head>

<body>

    <main class="login-container">

        <section class="login-box">

            <h1>Spotify Clone</h1>

            <h2>Entrar</h2>


            <form id="form-login">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >


                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    required
                >


                <button type="submit">
                    Entrar
                </button>

            </form>


            <hr>


            <h2>Criar conta</h2>


            <form id="form-cadastro">

                <label for="cadastro-email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="cadastro-email"
                    required
                >


                <label for="cadastro-senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="cadastro-senha"
                    minlength="6"
                    required
                >


                <button type="submit">
                    Criar conta
                </button>

            </form>


            <p id="mensagem"></p>

        </section>

    </main>


    <script
        type="module"
        src="./js/login.js">
    </script>
    
    <script
        type="module"
        src="./js/pwa.js">
    </script>


</body>

</html>
